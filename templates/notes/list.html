{% extends "notes/base.html" %}
{% block content %}
<h1>Мои заметки</h1>
<a href="{% url 'note_create' %}" class="btn btn-primary mb-3">+ Создать заметку</a>
{% for note in notes %}
<div class="card mb-2"><div class="card-body">
<h5>{{ note.title }}</h5>
<a href="{% url 'note_detail' note.pk %}" class="btn btn-sm btn-info">Открыть</a>
<a href="{% url 'note_delete' note.pk %}" class="btn btn-sm btn-danger">Удалить</a>
</div></div>
{% empty %}<p>Заметок пока нет.</p>{% endfor %}
{% endblock %}
